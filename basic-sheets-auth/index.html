<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Univer Basic Sheets Auth</title>
  </head>
  <body>
    <div id="app"></div>

    <section id="login-shell" class="login-shell" hidden>
      <div class="login-card">
        <div class="brand">
          <div class="brand-mark">U</div>
          <div>
            <h1>Basic Sheets Auth</h1>
            <p>登录后创建和协作编辑 Sheet</p>
          </div>
        </div>
        <div class="preset-users">
          <button type="button" data-login-user="alice">以 Alice 登录</button>
          <button type="button" data-login-user="bob">以 Bob 登录</button>
        </div>
        <div class="divider">或输入账号</div>
        <form id="login-form">
          <label>
            用户名
            <input id="username" value="alice" autocomplete="username" />
          </label>
          <label>
            密码
            <input
              id="password"
              type="password"
              value="alice-password"
              autocomplete="current-password"
            />
          </label>
          <button class="primary" type="submit">登录</button>
        </form>
        <p id="login-error" class="error"></p>
      </div>
    </section>

    <div id="session-bar" class="session-bar" hidden>
      <strong id="session-user"></strong>
      <span id="session-role" class="role"></span>
      <button id="share-button" type="button">成员</button>
      <button id="logout-button" type="button">退出</button>
    </div>

    <dialog id="share-dialog">
      <div class="dialog-header">
        <h2>协作成员</h2>
        <button id="close-share" type="button">关闭</button>
      </div>
      <div class="dialog-body">
        <div class="grant-row">
          <select id="target-user" aria-label="用户"></select>
          <select id="target-role" aria-label="角色">
            <option value="editor">可编辑</option>
            <option value="viewer">只读</option>
          </select>
          <button id="grant-member" type="button">添加或更新</button>
        </div>
        <p id="share-error" class="error"></p>
        <div id="member-list" class="member-list"></div>
      </div>
      <div class="dialog-footer">
        <button id="cancel-share" type="button">完成</button>
      </div>
    </dialog>

    <div id="page-error" class="page-error" hidden></div>
    <script type="module" src="/client/sheets/main.ts"></script>
  </body>
</html>

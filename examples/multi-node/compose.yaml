name: univer-collaboration-multi-node

x-build: &build
  context: ../..
  dockerfile: examples/multi-node/Dockerfile
  args:
    UNIVER_LICENSE: ${UNIVER_LICENSE:-}

x-app: &app
  image: univer-collaboration-multi-node:local
  build:
    <<: *build
    target: collab
  init: true

x-runtime: &runtime
  HOST: 0.0.0.0
  PORT: "3010"
  DATABASE_URL: postgres://univer:univer@postgres:5432/collaboration
  REDIS_URL: redis://redis:6379

x-health: &health
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
  interval: 3s
  timeout: 3s
  retries: 20

services:
  # Shared persistent storage for both nodes: collaboration tables and the file catalog.
  # schema.sql runs once when the data directory is first initialized; the nodes never run DDL.
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: univer
      POSTGRES_PASSWORD: univer
      POSTGRES_DB: collaboration
    volumes:
      - collaboration-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # Check over TCP: during initialization only a temporary socket-only server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U univer -d collaboration"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Shared real-time delivery and session tickets for both nodes.
  redis:
    image: redis:7.4.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  node-a:
    <<: *app
    environment:
      <<: *runtime
      NODE_ID: node-a
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *health

  node-b:
    <<: *app
    environment:
      <<: *runtime
      NODE_ID: node-b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *health

  # Import/export service: a separate deployment with its own replica count and resource limits.
  # Replicas share tasks and files through PostgreSQL, so any of them can answer any request.
  # Conversion runs in the replica that accepted the request; production uses a queue and workers.
  exchange:
    image: univer-collaboration-multi-node-exchange:local
    build:
      <<: *build
      target: exchange
    init: true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1g
    environment:
      HOST: 0.0.0.0
      PORT: "3011"
      DATABASE_URL: postgres://univer:univer@postgres:5432/collaboration
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.30.4-alpine
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3010}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
      exchange:
        condition: service_healthy

volumes:
  collaboration-data:

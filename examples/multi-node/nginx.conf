events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Read the routing key from the query for tickets and WebSockets, and from the path for submissions.
    map $uri $routing_unit {
        default $arg_unit;
        ~^/universer-api/comb/[^/]+/unit/(?<path_unit>[^/]+)/new_changes$ $path_unit;
    }

    # Restrict IDs to letters, digits, underscores, and hyphens so path and query hash keys match.
    map $routing_unit $valid_unit {
        default 0;
        ~^[a-zA-Z0-9_-]+$ 1;
    }

    upstream collaboration {
        # Tickets, WebSockets, and submissions for a document must reach the same node.
        hash $routing_unit consistent;
        # Keep the topology fixed: do not reassign session requests when a node fails.
        server node-a:3010 max_fails=0;
        server node-b:3010 max_fails=0;
    }

    upstream web {
        # Reads, pages, and file management can use either node through default round-robin routing.
        server node-a:3010;
        server node-b:3010;
    }

    access_log off;

    server {
        listen 80;
        client_max_body_size 16m;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_next_upstream off;

        location = /universer-api/user/session-ticket {
            if ($valid_unit = 0) { return 400; }
            proxy_pass http://collaboration;
        }

        location = /universer-api/comb/connect {
            if ($valid_unit = 0) { return 400; }
            proxy_pass http://collaboration;
        }

        location ~ ^/universer-api/comb/[^/]+/unit/[^/]+/new_changes$ {
            if ($valid_unit = 0) { return 400; }
            proxy_pass http://collaboration;
        }

        location = /api/node {
            # Use the same hash solely to display the document's collaboration node.
            if ($valid_unit = 0) { return 400; }
            proxy_pass http://collaboration;
        }

        location / {
            proxy_pass http://web;
        }
    }
}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Univer Basic Sheets Worktree</title>
  </head>
  <body>
    <header id="worktree-toolbar">
      <strong>Worktree</strong>
      <span id="worktree-identity">initializing…</span>
      <span id="worktree-status"></span>
      <button id="worktree-ready" type="button">Mark ready</button>

      <button id="worktree-discard" type="button">Discard</button>
      <span id="worktree-message"></span>
    </header>
    <div id="app"></div>
    <script type="module" src="/client/sheets/main.ts"></script>

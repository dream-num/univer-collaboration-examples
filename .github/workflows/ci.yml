name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build examples
        run: pnpm build

  # Guards main: a -next branch carries an insider .npmrc and pre-release SDK versions
  # until the SDK release is public, so this job runs only where that must not land.
  merge-gate:
    name: merge-gate
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject pre-release Univer SDK versions
        run: |
          manifests=$(git ls-files | grep -E '(^|/)package\.json$|^pnpm-workspace\.yaml$')
          prerelease=$(grep -nE '@univerjs(-pro)?/.*[0-9]-(insiders|dev|nightly|alpha|beta|rc|experimental)[.-]' $manifests || true)
          if [ -n "$prerelease" ]; then
            echo "Pre-release Univer SDK versions detected:"
            echo "$prerelease"
            echo
            echo "main depends only on publicly released SDK versions. Replace them with the"
            echo "released versions before merging to main."
            exit 1
          fi
          echo "No pre-release Univer SDK version is pinned."

      - name: Reject private npm registry configuration
        run: |
          npmrcs=$(git ls-files | grep -E '(^|/)\.npmrc$' || true)
          if [ -z "$npmrcs" ]; then
            echo "No .npmrc is committed."
            exit 0
          fi
          private=$(printf '%s\n' "$npmrcs" | xargs grep -hE '^[^#;]*registry=' | grep -v 'registry\.npmjs\.org' || true)
          if [ -n "$private" ]; then
            echo "Private npm registry configuration detected:"
            echo "$private"
            echo
            echo "Merging to main is not allowed while a private registry is configured."
            echo "Before merging to main, every npm package must be promoted to the public"
            echo "npm registry and the private registry configuration must be removed."
            exit 1
          fi
          echo "No private npm registry is configured."

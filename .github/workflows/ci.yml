name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build examples
        run: pnpm build

  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject private npm registry configuration
        run: |
          npmrcs=$(git ls-files | grep -E '(^|/)\.npmrc$' || true)
          if [ -z "$npmrcs" ]; then
            echo "No .npmrc is committed."
            exit 0
          fi
          private=$(printf '%s\n' "$npmrcs" | xargs grep -hE '^[^#;]*registry=' | grep -v 'registry\.npmjs\.org' || true)
          if [ -n "$private" ]; then
            echo "Private npm registry configuration detected:"
            echo "$private"
            echo
            echo "Merging to main is not allowed while a private registry is configured."
            echo "Before merging to main, every npm package must be promoted to the public"
            echo "npm registry and the private registry configuration must be removed."
            echo
            echo "合入 main 前必须把所有 npm 包提升到公开 npm，并移除私有源配置。"
            exit 1
          fi
          echo "No private npm registry is configured."
